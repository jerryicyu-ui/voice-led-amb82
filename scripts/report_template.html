<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<base href="__BASE__">
<title>Report</title>
<style>
  @page { size: A4; margin: 18mm 16mm; }
  body { font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; font-size: 10.5pt; line-height: 1.6; color: #1d2330; }
  h1 { font-size: 20pt; border-bottom: 3px solid #2563eb; padding-bottom: 6px; margin-top: 0; }
  h2 { font-size: 14pt; color: #1e3a8a; border-bottom: 1px solid #cbd5e1; padding-bottom: 3px; margin-top: 22px; break-after: avoid; }
  h3 { font-size: 11.5pt; margin: 16px 0 6px; break-after: avoid; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 9.5pt; break-inside: auto; }
  tr { break-inside: avoid; }
  th, td { border: 1px solid #cbd5e1; padding: 4px 6px; vertical-align: top; }
  th { background: #eef2f7; }
  code { font-family: Consolas, monospace; font-size: 9pt; background: #f1f5f9; padding: 0 3px; border-radius: 3px; }
  pre { background: #f1f5f9; padding: 8px 10px; border-radius: 4px; white-space: pre-wrap; break-inside: avoid; }
  pre code { background: none; padding: 0; }
  blockquote { margin: 8px 0; padding: 4px 12px; border-left: 4px solid #93c5fd; background: #f8fafc; color: #334155; }
  .mermaid { text-align: center; margin: 10px 0; break-inside: avoid; }
  a { color: #1d4ed8; word-break: break-all; }
  img { display: block; max-width: 70%; max-height: 120mm; margin: 10px auto 4px; border: 1px solid #cbd5e1; break-inside: avoid; }
  p:has(> img) + p > em:only-child { display: block; text-align: center; font-size: 9pt; color: #475569; }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
</head>
<body>
<div id="content"></div>
<script type="text/plain" id="markdown">__MARKDOWN__</script>
<script>
  const source = document.getElementById('markdown').textContent
    // Drop the "how to export" hint line; it is only meaningful in the Markdown draft
    .replace(/^> 匯出 PDF 時.*$/m, '');
  const content = document.getElementById('content');
  content.innerHTML = marked.parse(source);
  content.querySelectorAll('pre code.language-mermaid').forEach((code) => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    code.parentElement.replaceWith(div);
  });
  mermaid.initialize({ startOnLoad: false, theme: 'neutral', flowchart: { htmlLabels: true } });
  mermaid.run().finally(() => { document.title = 'READY'; });
</script>
</body>
</html>
