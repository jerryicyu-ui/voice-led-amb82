<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>解析器自我測試</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div><h1>指令解析器自我測試</h1><p id="summary" class="sub"></p></div></header>
  <main>
    <section class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>輸入</th><th>預期</th><th>實際</th><th>原因</th><th>結果</th></tr></thead>
          <tbody id="body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer><a href="index.html">← 回控制頁</a></footer>
  <script src="commands.js"></script>
  <script>
    let passed = 0;
    document.getElementById('body').innerHTML = PARSER_CASES.map(([input, expected], i) => {
      const actual = parseCommand(input);
      const ok = actual.cmd === expected;
      if (ok) passed++;
      return `<tr class="${ok ? '' : 'error'}"><td>${i + 1}</td><td>${input || '（空白）'}</td>
        <td>${expected ?? '不執行'}</td><td>${actual.cmd ?? '不執行'}</td><td>${actual.reason}</td>
        <td>${ok ? '✅ 通過' : '❌ 失敗'}</td></tr>`;
    }).join('');
    document.getElementById('summary').textContent = `${passed} / ${PARSER_CASES.length} 通過`;
  </script>
</body>
</html>
